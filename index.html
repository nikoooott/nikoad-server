<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТВЕРЬ • Social</title><style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111318;--muted:#747982;--line:#e7e8ec;--accent:#111}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{max-width:1100px;height:64px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:900;letter-spacing:-1px}.logo span{font-weight:500;color:#777}.nav{display:flex;gap:8px}.nav button{border:0;background:#f0f1f4;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(0,700px) 300px;gap:22px;padding:20px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}.hero{background:#111;color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:#bbb;line-height:1.45}.stories{display:flex;gap:14px;overflow:auto;margin-bottom:16px}.story{min-width:70px;text-align:center;font-size:11px;color:var(--muted)}.story img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid #111;margin-bottom:5px}.posthead{display:flex;gap:10px;align-items:center;padding:13px 15px}.mini{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#ddd}.name{font-weight:800;font-size:14px}.meta{font-size:12px;color:var(--muted)}.more{margin-left:auto;border:0;background:none;font-size:18px}.photo{display:block;width:100%;max-height:700px;object-fit:cover;background:#ddd}.actions{display:flex;gap:2px;padding:7px 11px}.act{border:0;background:none;font-size:23px;padding:5px 7px}.save{margin-left:auto}.likes{font-weight:750;font-size:14px;padding:0 15px 6px}.caption{font-size:14px;line-height:1.45;padding:0 15px 8px}.comments{padding:0 15px 12px;color:var(--muted);font-size:13px}.commentbox{border-top:1px solid var(--line);display:flex;padding:10px;gap:8px}.commentbox input{flex:1;border:0;background:#f4f5f7;border-radius:18px;padding:9px 12px;outline:0}.commentbox button{border:0;background:none;font-weight:800}.sidecard{padding:17px}.side-title{font-weight:850;margin-bottom:12px}.side p{color:var(--muted);font-size:13px;line-height:1.45}.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.person img{width:42px;height:42px;border-radius:50%;object-fit:cover}.follow{margin-left:auto;border:0;background:#111;color:#fff;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:750}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.box{background:#fff;border-radius:20px;padding:20px;width:min(460px,100%)}.box input,.box textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;margin:6px 0 12px;outline:0}.box textarea{min-height:90px;resize:vertical}.primary{background:#111;color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:800}.secondary{background:#eee;border:0;border-radius:11px;padding:11px 15px;font-weight:700;margin-right:6px}.auth{text-align:center}.auth h2{margin-top:0}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:0;padding:10px;border-radius:10px;background:#eee;font-weight:700}.tabs .on{background:#111;color:#fff}.empty{text-align:center;color:var(--muted);padding:35px}.comment{padding:7px 0}.comment b{margin-right:5px}.error{color:#c62828;font-size:13px;margin:5px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(15px);background:#111;color:#fff;padding:10px 15px;border-radius:999px;opacity:0;transition:.2s;z-index:30}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:10px 7px 40px}.side{display:none}.card,.hero{border-radius:14px}.topin{padding:0 10px}.nav button{padding:8px}}
</style></head><body><header class="top"><div class="topin"><div class="logo">ТВЕРЬ <span>• social</span></div><nav class="nav" id="nav"></nav></div></header><main class="wrap"><section><div class="hero"><h1>Тверь 🤍</h1><p>Место, где жители Твери делятся фотографиями, знакомятся, общаются и находят своих.</p></div><div id="stories"></div><div id="feed"></div></section><aside class="side"><div class="card sidecard"><div class="side-title">О проекте</div><p>Локальная соцсеть только для Твери. Здесь можно создавать профиль, выкладывать фото, ставить лайки, писать комментарии и подписываться друг на друга.</p><button class="primary" style="width:100%" onclick="openCreate()">＋ Опубликовать фото</button></div><div class="card sidecard"><div class="side-title">👥 Люди из Твери</div><div id="people"></div></div></aside></main><div id="modal"></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);let me=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),1800)}
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function avatar(u){return u.avatar||`https://i.pravatar.cc/100?u=${encodeURIComponent(u.username||u.id)}`}
async function init(){const d=await api('/api/me');me=d.user;renderNav();await loadFeed();if(me)loadPeople();}
function renderNav(){const n=$('#nav');if(me)n.innerHTML=`<button onclick="openCreate()">＋ Фото</button><button onclick="profile('${esc(me.username)}')">${esc(me.name)}</button><button onclick="logout()">Выйти</button>`;else n.innerHTML=`<button onclick="authModal('login')">Войти</button><button onclick="authModal('register')">Регистрация</button>`}
async function loadFeed(){const d=await api('/api/feed');const f=$('#feed');if(!d.posts.length){f.innerHTML='<div class="card empty">Пока нет публикаций. Стань первым! 📸</div>';return}f.innerHTML=d.posts.map(postCard).join('')}
function postCard(p){return `<article class="card" id="post-${p.id}"><div class="posthead"><img class="mini" src="${avatar(p)}"><div><div class="name">${esc(p.name)}</div><div class="meta">@${esc(p.username)} • ${new Date(p.created_at+'Z').toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div></div><img class="photo" src="${esc(p.image)}"><div class="actions"><button class="act" onclick="toggleLike(${p.id},this)">${p.liked?'♥':'♡'}</button><button class="act" onclick="showComments(${p.id})">◯</button><button class="act" onclick="sharePost(${p.id})">↗</button><button class="act save" onclick="toast('Сохранено')">▢</button></div><div class="likes"><span id="likes-${p.id}">${p.likes}</span> лайков</div><div class="caption"><b>${esc(p.name)}</b> ${esc(p.caption)}</div><div class="comments" id="comments-${p.id}">Комментариев: ${p.comments}</div><div class="commentbox"><input id="input-${p.id}" placeholder="Написать комментарий..." ${me?'':'disabled'}><button onclick="sendComment(${p.id})">Отправить</button></div></article>`}
async function toggleLike(id,b){if(!me)return authModal('login');try{const d=await api('/api/posts/'+id+'/like',{method:'POST'});b.textContent=d.liked?'♥':'♡';$('#likes-'+id).textContent=d.likes}catch(e){toast(e.message)}}
async function sendComment(id){if(!me)return authModal('login');const i=$('#input-'+id);if(!i.value.trim())return;try{await api('/api/posts/'+id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:i.value})});i.value='';showComments(id)}catch(e){toast(e.message)}}
async function showComments(id){const d=await api('/api/posts/'+id+'/comments');const e=$('#comments-'+id);e.innerHTML=d.comments.length?d.comments.map(c=>`<div class="comment"><b>${esc(c.name)}</b>${esc(c.text)}</div>`).join(''):'Пока нет комментариев';}
async function sharePost(id){const url=location.href.split('#')[0]+'#post-'+id;if(navigator.share)await navigator.share({title:'Тверь Social',text:'Посмотри этот пост',url});else{toast('Ссылка на пост: '+url)}}
async function loadPeople(){const d=await api('/api/users');$('#people').innerHTML=d.users.length?d.users.map(u=>`<div class="person"><img src="${avatar(u)}"><div><b>${esc(u.name)}</b><div class="meta">@${esc(u.username)}</div></div><button class="follow" onclick="follow(${u.id},this)">Подписаться</button></div>`).join(''):'Пока никого нет';}
async function follow(id,b){try{const d=await api('/api/users/'+id+'/follow',{method:'POST'});b.textContent=d.following?'Вы подписаны':'Подписаться'}catch(e){toast(e.message)}}
function profile(username){location.hash='user/'+username;toast('Профиль @'+username)}
function openCreate(){if(!me)return authModal('login');$('#modal').innerHTML=`<div class="modal on"><div class="box"><h2>Новая публикация 📸</h2><form onsubmit="createPost(event)"><label>Фото</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><label>Подпись</label><textarea name="caption" maxlength="500" placeholder="Что происходит в Твери?"></textarea><div style="text-align:right"><button type="button" class="secondary" onclick="closeModal()">Отмена</button><button class="primary">Опубликовать</button></div></form></div></div>`}
async function createPost(e){e.preventDefault();const fd=new FormData(e.target);try{await api('/api/posts',{method:'POST',body:fd});closeModal();toast('Фото опубликовано');loadFeed()}catch(err){toast(err.message)}}
function closeModal(){$('#modal').innerHTML=''}
function authModal(tab){$('#modal').innerHTML=`<div class="modal on"><div class="box auth"><div class="tabs"><button class="${tab==='login'?'on':''}" onclick="authModal('login')">Войти</button><button class="${tab==='register'?'on':''}" onclick="authModal('register')">Регистрация</button></div><div id="authbody"></div></div></div>`;$('#authbody').innerHTML=tab==='login'?`<h2>С возвращением 👋</h2><form onsubmit="login(event)"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Пароль" required><div class="error" id="autherr"></div><button class="primary" style="width:100%">Войти</button></form>`:`<h2>Создать профиль</h2><form onsubmit="register(event)"><input name="name" placeholder="Ваше имя" required><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Пароль (минимум 6 символов)" required><div class="error" id="autherr"></div><button class="primary" style="width:100%">Зарегистрироваться</button></form>`}
async function login(e){e.preventDefault();try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});me=d.user;closeModal();renderNav();loadFeed();loadPeople();toast('Выполнен вход')}catch(err){$('#autherr').textContent=err.message}}
async function register(e){e.preventDefault();try{const d=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});me=d.user;closeModal();renderNav();loadFeed();loadPeople();toast('Профиль создан')}catch(err){$('#autherr').textContent=err.message}}
async function logout(){await api('/api/logout',{method:'POST'});me=null;renderNav();loadFeed();toast('Вы вышли')}
init();
</script></body></html>
